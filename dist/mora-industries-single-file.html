/* ============================================================
   MORA INDUSTRIES — stylesheet
   Palette, type scale and components. Design tokens live in
   :root at the top of this file.
   ============================================================ */
/* ============================================================
   MORA INDUSTRIES — DESIGN SYSTEM
   Palette derived from the MORA master identity gradient:
   deep navy (trust) → teal (intelligence) → aqua (digital energy)
   with restrained gold reserved exclusively for opportunity markers.
   ============================================================ */
:root{
  --ink:#04202F;
  --navy:#083A56;
  --navy-soft:#0E4A6B;
  --teal:#14768C;
  --teal-bright:#1F9CB8;
  --aqua:#6FD6E7;
  --aqua-pale:#C9EDF4;
  --gold:#B8862B;
  --gold-pale:#EFE0C2;

  --paper:#F4F8FA;
  --panel:#FFFFFF;
  --tint:#E9F2F6;
  --tint-deep:#DCEAF0;

  --line:rgba(8,58,86,.15);
  --line-soft:rgba(8,58,86,.08);
  --muted:#4C6A7A;
  --muted-light:#55707D;

  --display:'Jost',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;

  --gut:clamp(20px,5vw,64px);
  --maxw:1280px;
  --r:2px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%}
a{color:inherit}

/* ---------- Type ---------- */
h1,h2,h3,h4{font-family:var(--display);font-weight:300;margin:0;letter-spacing:-.015em;line-height:1.1}
h1{font-size:clamp(2.15rem,4.6vw,4rem);letter-spacing:-.028em}
h2{font-size:clamp(1.75rem,3.1vw,2.9rem);letter-spacing:-.022em}
h3{font-size:clamp(1.2rem,1.75vw,1.6rem);letter-spacing:-.012em;font-weight:400}
h4{font-size:1.03rem;font-weight:500;letter-spacing:-.005em;line-height:1.35}
/* Block-level headings sit at h3 for a correct outline but keep the
   smaller card/step visual weight. */
.card h3,.steps h3,.role h3,.slot h3{font-size:1.03rem;font-weight:500;letter-spacing:-.005em;line-height:1.35}
p{margin:0 0 1.1em}
p:last-child{margin-bottom:0}

/* The mono face is the "evidence voice": every label, source note,
   verification scope and date is set in it. Structure encodes the
   brand's evidence standard. */
.ey{
  font-family:var(--mono);font-size:.685rem;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--teal);
  display:block;margin-bottom:1.1rem;
}
.ey--pale{color:var(--aqua)}
.ey--muted{color:var(--muted-light)}
.tag{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
}
.lede{font-size:clamp(1.02rem,1.35vw,1.2rem);color:var(--muted);max-width:64ch;line-height:1.62}
.lede--light{color:rgba(233,242,246,.82)}

/* ---------- Spectrum rule: the site's structural signature ----------
   A prism disperses one input into an ordered spectrum. The rule marks
   every major section boundary and carries the brand gradient. */
.spectrum{height:2px;border:0;margin:0;
  background:linear-gradient(90deg,var(--navy) 0%,var(--teal) 34%,var(--aqua) 68%,var(--gold) 100%);
}
.spectrum--soft{opacity:.5}

/* ---------- Layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}
.sec{padding-block:clamp(56px,7.5vw,116px)}
.sec--tight{padding-block:clamp(40px,5vw,72px)}
.sec--tint{background:var(--tint)}
.sec--panel{background:var(--panel)}
.sec--ink{background:var(--ink);color:var(--tint)}
.sec--ink h2,.sec--ink h3,.sec--ink h4{color:#fff}
.sec--ink p{color:rgba(233,242,246,.8)}

/* Asymmetric research-document grid: a narrow left rail carries the
   section label, the wide right column carries the argument. */
.rail{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:start}
@media (max-width:860px){.rail{grid-template-columns:1fr;gap:8px}}
.rail__label{position:sticky;top:96px}
@media (max-width:860px){.rail__label{position:static;top:auto}}

.grid{display:grid;gap:clamp(14px,1.6vw,22px)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:.6em;
  font-family:var(--body);font-size:.9rem;font-weight:500;letter-spacing:.005em;
  padding:.85em 1.5em;border-radius:var(--r);border:1px solid transparent;
  text-decoration:none;cursor:pointer;background:none;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn__ar{transition:transform .18s ease}
.btn:hover .btn__ar{transform:translateX(3px)}
.btn--pri{background:var(--teal);color:#fff}
.btn--pri:hover{background:var(--navy)}
.btn--sec{border-color:var(--line);color:var(--navy);background:var(--panel)}
.btn--sec:hover{border-color:var(--teal);color:var(--teal)}
.btn--ghost{color:var(--navy);padding-inline:0}
.btn--ghost:hover{color:var(--teal)}
.btn--onink{background:var(--aqua);color:var(--ink)}
.btn--onink:hover{background:#fff}
.btn--onink-sec{border-color:rgba(201,237,244,.32);color:var(--aqua-pale)}
.btn--onink-sec:hover{border-color:var(--aqua);color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}

:focus-visible{outline:2px solid var(--teal-bright);outline-offset:3px;border-radius:1px}
.sec--ink :focus-visible{outline-color:var(--aqua)}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:.8em 1.2em;z-index:200}
.skip:focus{left:0}

/* ---------- Cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--line-soft);
  padding:clamp(18px,2.1vw,30px);border-radius:var(--r);
  display:flex;flex-direction:column;gap:.7rem;position:relative;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.card--link{text-decoration:none;color:inherit}
.card--link:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(4,32,47,.45)}
.card__k{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--teal);
}
.card p{color:var(--muted);font-size:.95rem}
.card--onink{background:rgba(255,255,255,.045);border-color:rgba(201,237,244,.16)}
.card--onink p{color:rgba(233,242,246,.76)}
.card--onink .card__k{color:var(--aqua)}
.card--onink.card--link:hover{border-color:var(--aqua);background:rgba(255,255,255,.075)}

/* Top spectrum edge marks cards that represent a pillar or product */
.card--edge{padding-top:calc(clamp(18px,2.1vw,30px) + 4px)}
.card--edge::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--navy),var(--teal),var(--aqua));
}
.card--edge.gold::before{background:linear-gradient(90deg,var(--teal),var(--aqua),var(--gold))}

/* ---------- Lists ---------- */
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.ticks li{position:relative;padding-left:1.4em;color:var(--muted);font-size:.95rem}
.ticks li::before{
  content:"";position:absolute;left:0;top:.62em;width:9px;height:1px;background:var(--teal);
}
.sec--ink .ticks li{color:rgba(233,242,246,.78)}
.sec--ink .ticks li::before{background:var(--aqua)}

/* ---------- Data table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.93rem;text-align:left}
.tbl th{
  font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--teal);font-weight:500;padding:0 1.1rem .7rem 0;
  border-bottom:1px solid var(--line);vertical-align:bottom;
}
.tbl td{padding:.95rem 1.1rem .95rem 0;border-bottom:1px solid var(--line-soft);color:var(--muted);vertical-align:top}
.tbl td:first-child{color:var(--ink);font-weight:500;width:33%}
.tblscroll{overflow-x:auto}
@media (max-width:620px){.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr{border-bottom:1px solid var(--line);padding-block:.9rem}
  .tbl td{border:0;padding:.15rem 0}
  .tbl td:first-child{width:auto;margin-bottom:.2rem}
}

/* ---------- Numbered sequence ----------
   Numbers appear only where order genuinely carries meaning:
   the method, deployment, and marketplace onboarding sequences. */
.steps{counter-reset:s;display:grid;gap:0;border-top:1px solid var(--line)}
.steps li{
  counter-increment:s;list-style:none;display:grid;
  grid-template-columns:64px minmax(0,1fr);gap:clamp(14px,2.4vw,36px);
  padding:1.35rem 0;border-bottom:1px solid var(--line-soft);align-items:baseline;
}
.steps li::before{
  content:counter(s,decimal-leading-zero);
  font-family:var(--mono);font-size:.8rem;color:var(--aqua);letter-spacing:.06em;
}
.sec--ink .steps{border-color:rgba(201,237,244,.2)}
.sec--ink .steps li{border-color:rgba(201,237,244,.1)}
.steps h3{margin-bottom:.25rem}
.steps p{font-size:.94rem;color:var(--muted);margin:0}
@media (max-width:620px){.steps li{grid-template-columns:1fr;gap:.3rem}}

/* ---------- Evidence note: reusable disclosure block ----------
   Used for verification scope, role clarity, methodology and limits. */
.note{
  border-left:2px solid var(--gold);background:var(--gold-pale);
  padding:1.15rem 1.35rem;border-radius:0 var(--r) var(--r) 0;
}
.note .tag{color:#7A5A15;display:block;margin-bottom:.4rem}
.note p{font-size:.92rem;color:#4A3A16;margin:0}
.note--cool{border-left-color:var(--teal);background:var(--tint)}
.note--cool .tag{color:var(--teal)}
.note--cool p{color:var(--muted)}

/* ---------- Placeholder slot (unapproved proof) ---------- */
.slot{
  border:1px dashed rgba(8,58,86,.28);background:repeating-linear-gradient(-45deg,transparent,transparent 7px,rgba(8,58,86,.028) 7px,rgba(8,58,86,.028) 14px);
  padding:1.15rem;border-radius:var(--r);display:flex;flex-direction:column;gap:.35rem;min-height:104px;
  align-items:flex-start;justify-content:center;
}
.slot .tag{color:var(--muted-light)}
.slot strong{font-family:var(--display);font-weight:400;font-size:1rem;color:var(--navy-soft)}
.slot p{font-size:.85rem;color:var(--muted-light);margin:0}

/* ============================================================
   HEADER
   ============================================================ */
.hdr{position:sticky;top:0;z-index:100;background:rgba(244,248,250,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.hdr__in{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut);display:flex;align-items:center;gap:clamp(14px,2.4vw,38px);height:74px}
.logo{display:flex;align-items:center;color:var(--navy);text-decoration:none;flex:0 0 auto}
.logo svg{width:118px;height:auto;display:block}
.logo:hover{color:var(--teal)}

.nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav__btn{
  font-family:var(--body);font-size:.875rem;font-weight:500;color:var(--navy);
  background:none;border:0;padding:.6em .78em;cursor:pointer;border-radius:var(--r);
  display:inline-flex;align-items:center;gap:.35em;text-decoration:none;white-space:nowrap;
}
.nav__btn:hover,.nav__btn[aria-expanded="true"]{color:var(--teal);background:var(--tint)}
.nav__btn svg{width:9px;height:9px;transition:transform .2s ease}
.nav__btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.nav__util{display:flex;align-items:center;gap:.35rem;margin-left:.5rem;padding-left:.85rem;border-left:1px solid var(--line)}
.nav__lang{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--muted);background:none;border:0;cursor:pointer;padding:.5em}
.nav__lang:hover{color:var(--teal)}
@media (max-width:1100px){.nav{display:none}}

/* Mega menu */
.mega{
  position:absolute;left:0;right:0;top:100%;background:var(--panel);
  border-bottom:1px solid var(--line);box-shadow:0 24px 40px -30px rgba(4,32,47,.4);
  display:none;
}
.mega[data-open="true"]{display:block}
.mega__in{max-width:var(--maxw);margin:0 auto;padding:clamp(24px,3vw,40px) var(--gut) clamp(28px,3.4vw,44px);
  display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(24px,4vw,64px)}
.mega__blurb p{font-size:.88rem;color:var(--muted)}
.mega__links{display:grid;gap:2px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.mega__link{
  text-decoration:none;color:inherit;padding:.85rem 1rem;border-radius:var(--r);
  display:block;transition:background .16s ease;border:1px solid transparent;
}
.mega__link:hover{background:var(--tint)}
.mega__link strong{display:block;font-family:var(--display);font-weight:400;font-size:1rem;color:var(--navy);margin-bottom:.15rem}
.mega__link span{font-size:.83rem;color:var(--muted);line-height:1.45;display:block}

/* Mobile nav */
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--r);padding:.55em .7em;cursor:pointer;color:var(--navy)}
.burger svg{display:block;width:18px;height:18px}
@media (max-width:1100px){.burger{display:block}}
.mnav{display:none;background:var(--panel);border-bottom:1px solid var(--line);max-height:calc(100vh - 74px);overflow-y:auto}
.mnav[data-open="true"]{display:block}
.mnav__in{padding:12px var(--gut) 28px}
.mnav details{border-bottom:1px solid var(--line-soft)}
.mnav summary{padding:.95rem 0;cursor:pointer;font-weight:500;font-size:.95rem;color:var(--navy);list-style:none;display:flex;justify-content:space-between;align-items:center}
.mnav summary::-webkit-details-marker{display:none}
.mnav summary::after{content:"+";font-family:var(--mono);color:var(--teal)}
.mnav details[open] summary::after{content:"–"}
.mnav__sub{display:grid;gap:1px;padding:0 0 .9rem}
.mnav__sub a{padding:.6rem 0 .6rem .9rem;text-decoration:none;color:var(--muted);font-size:.9rem;border-left:1px solid var(--line)}
.mnav__sub a:hover{color:var(--teal);border-color:var(--teal)}
.mnav__flat{display:block;padding:.95rem 0;text-decoration:none;font-weight:500;font-size:.95rem;color:var(--navy);border-bottom:1px solid var(--line-soft)}
.mnav__cta{margin-top:1.2rem;display:grid;gap:.6rem}

/* ============================================================
   HERO
   ============================================================ */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;inset:auto 0 0 0;height:2px;
  background:linear-gradient(90deg,var(--navy) 0%,var(--teal) 34%,var(--aqua) 68%,var(--gold) 100%);
}
.hero__in{
  max-width:var(--maxw);margin:0 auto;padding:clamp(52px,7vw,104px) var(--gut) clamp(56px,7vw,104px);
  display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:clamp(28px,5vw,72px);align-items:center;
}
@media (max-width:940px){.hero__in{grid-template-columns:1fr;gap:36px}}
.hero h1{color:#fff;max-width:15ch}
.hero__body{color:rgba(233,242,246,.8);font-size:clamp(1rem,1.28vw,1.13rem);max-width:56ch;margin:1.5rem 0 2rem}
.hero__support{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--aqua);margin-top:2rem;display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;
}
.hero__support i{width:14px;height:1px;background:rgba(111,214,231,.5);display:inline-block;font-style:normal}

/* Interior page hero */
.phero{background:var(--ink);color:#fff;position:relative}
.phero::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;
  background:linear-gradient(90deg,var(--navy),var(--teal) 40%,var(--aqua) 75%,var(--gold))}
.phero__in{max-width:var(--maxw);margin:0 auto;padding:clamp(44px,5.6vw,88px) var(--gut) clamp(46px,5.6vw,88px)}
.phero h1{color:#fff;max-width:19ch}
.phero .lede{color:rgba(233,242,246,.8);margin:1.35rem 0 2rem;max-width:62ch}
.crumb{font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:rgba(201,237,244,.55);margin-bottom:1.4rem}
.crumb a{text-decoration:none;color:inherit}
.crumb a:hover{color:var(--aqua)}
.crumb span{margin:0 .5em;opacity:.5}

/* ============================================================
   PRISM DIAGRAM — the signature element
   Fragmented internal data and external signals enter from the left,
   pass through the prism, and leave as an ordered, prioritized spectrum.
   ============================================================ */
.prism{width:100%;height:auto;display:block;overflow:visible}
.prism text{font-family:'IBM Plex Mono',monospace;font-size:9.4px;letter-spacing:.11em;text-transform:uppercase}
.prism .lbl-in{fill:rgba(201,237,244,.44)}
.prism .lbl-out{fill:rgba(233,242,246,.9)}
.prism .ray-in{stroke:rgba(201,237,244,.42);stroke-width:1}
.prism .body{fill:rgba(111,214,231,.07);stroke:rgba(111,214,231,.6);stroke-width:1.15}
.prism .band{stroke-width:2.4;stroke-linecap:round}
.prism .dot{fill:var(--gold)}
@media (prefers-reduced-motion:no-preference){
  .prism .anim{opacity:0;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) forwards}
  .prism .ray-in.anim{stroke-dasharray:120;stroke-dashoffset:120;animation:draw .8s ease forwards,fadeIn .3s ease forwards}
  .prism .band.anim{stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1s cubic-bezier(.22,1,.36,1) forwards,fadeIn .4s ease forwards}
}
.prism--compact{display:none}
@media (max-width:700px){
  .prism--wide{display:none}
  .prism--compact{display:block;max-width:340px;margin-inline:auto}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   PAGE-SPECIFIC
   ============================================================ */
/* Pillar cards on home */
.pillar{display:flex;flex-direction:column;gap:.85rem;padding:clamp(20px,2.3vw,32px);background:var(--panel);border:1px solid var(--line-soft);position:relative;border-radius:var(--r);text-decoration:none;color:inherit;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.pillar::before{content:"";position:absolute;inset:0 0 auto 0;height:3px}
.pillar:nth-child(1)::before{background:linear-gradient(90deg,var(--navy),var(--navy-soft))}
.pillar:nth-child(2)::before{background:linear-gradient(90deg,var(--teal),var(--teal-bright))}
.pillar:nth-child(3)::before{background:linear-gradient(90deg,var(--teal-bright),var(--aqua))}
.pillar:hover{transform:translateY(-3px);box-shadow:0 16px 34px -22px rgba(4,32,47,.5);border-color:var(--line)}
.pillar h3{margin-top:.3rem}
.pillar p{color:var(--muted);font-size:.95rem;flex:1}
.pillar__go{font-size:.85rem;font-weight:500;color:var(--teal);display:inline-flex;gap:.45em;align-items:center}
.pillar:hover .pillar__go{gap:.75em}

/* Audience route tiles */
.route{display:flex;flex-direction:column;gap:.5rem;padding:1.3rem 1.4rem;background:var(--panel);border:1px solid var(--line-soft);text-decoration:none;color:inherit;border-radius:var(--r);transition:border-color .18s,background .18s}
.route:hover{border-color:var(--teal);background:var(--tint)}
.route strong{font-family:var(--display);font-weight:400;font-size:1.12rem;color:var(--navy)}
.route p{font-size:.89rem;color:var(--muted);margin:0}
.route span{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-top:.35rem}

/* Trust markers strip */
.markers{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.6rem}
.markers li{list-style:none;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid rgba(201,237,244,.28);color:var(--aqua-pale);padding:.55em .85em;border-radius:var(--r)}

/* Split feature row */
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3.2vw,52px);align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}

/* Product spotlight */
.spot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2vw,26px)}
@media (max-width:860px){.spot{grid-template-columns:1fr}}
.spot__card{background:var(--ink);color:#fff;padding:clamp(24px,3vw,42px);border-radius:var(--r);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:.9rem}
.spot__card--trade{background:linear-gradient(150deg,var(--navy) 0%,var(--teal) 100%)}
.spot__card h3{color:#fff;max-width:20ch}
.spot__card p{color:rgba(233,242,246,.82);font-size:.96rem;flex:1}
.spot__card .ey{color:var(--aqua)}

/* FAQ */
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line-soft)}
.faq summary{padding:1.15rem 2rem 1.15rem 0;cursor:pointer;list-style:none;position:relative;
  font-family:var(--display);font-size:1.06rem;font-weight:400;color:var(--navy)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:.2rem;top:1.05rem;font-family:var(--mono);color:var(--teal);font-size:1.1rem}
.faq details[open] summary::after{content:"–"}
.faq summary:hover{color:var(--teal)}
.faq__a{padding:0 2rem 1.3rem 0;color:var(--muted);font-size:.95rem;max-width:76ch}

/* Verification level table */
.vlevels{display:grid;gap:0;border-top:1px solid var(--line)}
.vlevel{display:grid;grid-template-columns:238px minmax(0,1fr);gap:clamp(14px,2.6vw,40px);padding:1.2rem 0;border-bottom:1px solid var(--line-soft);align-items:start}
@media (max-width:700px){.vlevel{grid-template-columns:1fr;gap:.4rem}}
.vlevel__l{white-space:nowrap;display:inline-flex;align-items:center;gap:.5em;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);
  border:1px solid var(--line);padding:.42em .7em;border-radius:var(--r);background:var(--panel);width:fit-content}
.vlevel__l i{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block;font-style:normal}
.vlevel__l.l1 i{background:var(--muted-light)}
.vlevel__l.l2 i{background:var(--teal-bright)}
.vlevel__l.l3 i{background:var(--teal)}
.vlevel__l.l4 i{background:var(--navy)}
.vlevel__l.l5 i{background:var(--gold)}
.vlevel p{font-size:.94rem;color:var(--muted);margin:0}
.vlevel__scope{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-light);margin-top:.45rem;display:block}

/* Insights */
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:2.2rem}
.chip{font-family:var(--mono);font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:.55em .85em;border-radius:var(--r);cursor:pointer;transition:.16s}
.chip:hover{border-color:var(--teal);color:var(--teal)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.post{display:flex;flex-direction:column;gap:.6rem;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--line-soft);padding:1.5rem;border-radius:var(--r);transition:.2s}
.post:hover{border-color:var(--teal);transform:translateY(-2px)}
.post__meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-light);display:flex;flex-wrap:wrap;gap:.35rem .8rem;align-items:baseline}
.post__meta b{color:var(--teal);font-weight:500}
.post h3{font-size:1.14rem}
.post p{font-size:.92rem;color:var(--muted);margin:0}

/* Article */
.article{max-width:none}
.article__grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:clamp(28px,5vw,72px);align-items:start}
@media (max-width:960px){.article__grid{grid-template-columns:1fr}}
.prose{max-width:70ch;font-size:1.03rem}
.prose h2{font-size:clamp(1.4rem,2.1vw,1.85rem);margin:2.4rem 0 .9rem}
.prose h3{font-size:1.13rem;margin:1.9rem 0 .6rem;font-weight:500}
.prose p{color:#1F3A48;margin-bottom:1.15em}
.prose ul{padding-left:0;list-style:none;display:grid;gap:.5rem;margin:0 0 1.3em}
.prose ul li{position:relative;padding-left:1.4em;color:#1F3A48}
.prose ul li::before{content:"";position:absolute;left:0;top:.68em;width:9px;height:1px;background:var(--teal)}
.prose sup{font-family:var(--mono);font-size:.62rem;color:var(--teal);font-weight:500}
.aside{position:sticky;top:98px;display:grid;gap:1.4rem;font-size:.86rem}
@media (max-width:960px){.aside{position:static;top:auto}}
.aside h3{font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--teal);font-weight:500;margin-bottom:.5rem}
.aside p,.aside li{color:var(--muted);font-size:.86rem}
.aside ol{margin:0;padding-left:1.1rem;display:grid;gap:.5rem}
.aside ol li::marker{font-family:var(--mono);font-size:.72rem;color:var(--teal)}

/* Careers */
.role{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.2rem;align-items:center;
  padding:1.35rem 0;border-bottom:1px solid var(--line-soft);text-decoration:none;color:inherit}
.role:hover h3{color:var(--teal)}
.role__meta{font-family:var(--mono);font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-light);margin-top:.3rem;display:flex;gap:.75rem;flex-wrap:wrap}
@media (max-width:620px){.role{grid-template-columns:1fr;gap:.7rem;align-items:start}}

/* Partners / who works with us */
.plogos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem}
@media (max-width:900px){.plogos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.plogos{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Forms */
.form{display:grid;gap:1.1rem;max-width:660px}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem}
@media (max-width:620px){.frow{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:.4rem}
.field label{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}

/* ============================================================
   REFINEMENT LAYER
   Everything below tunes the system already declared above.
   It adds no new colours: only depth, rhythm, state and the
   components the approved content introduced.
   ============================================================ */
:root{
  --r-lg:6px;
  --ease:cubic-bezier(.22,1,.36,1);
  --sh-sm:0 1px 2px rgba(4,32,47,.05);
  --sh-md:0 14px 30px -20px rgba(4,32,47,.38);
  --sh-lg:0 28px 60px -34px rgba(4,32,47,.5);
  --hdr-h:74px;
}

/* ---------- Typographic rhythm ---------- */
h1,h2{text-wrap:balance}
h3,h4{text-wrap:pretty}
p,.lede,.aud__d,.card p{text-wrap:pretty}
.h2--tight{max-width:22ch}
.split .h2--tight,.talk .h2--tight{max-width:19ch}
.lede--wide{max-width:70ch;margin:1.35rem 0 2.7rem}
h3.sub{
  font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--teal);margin:2rem 0 .9rem;
}
h3.sub:first-of-type{margin-top:0}
::selection{background:var(--aqua);color:var(--ink)}

/* Optical detail: the rail label reads as a margin note, not a heading. */
.rail__label .ey{margin-bottom:.5rem}
.rail__label::before{
  content:"";display:block;width:26px;height:2px;margin-bottom:1rem;
  background:linear-gradient(90deg,var(--teal),var(--aqua));
}
.sec--ink .rail__label::before{background:linear-gradient(90deg,var(--aqua),var(--gold))}
@media (max-width:860px){.rail__label{margin-bottom:1.4rem}}

/* Section boundaries: a hairline where two light surfaces meet. */
.sec--panel + .sec:not(.sec--panel):not(.sec--ink),
.sec:not(.sec--panel):not(.sec--ink) + .sec--panel{border-top:1px solid var(--line-soft)}

/* ============================================================
   HEADER — condensed state, scroll read-out, active section
   ============================================================ */
.hdr{transition:box-shadow .25s var(--ease),background .25s var(--ease)}
.hdr.is-stuck{background:rgba(244,248,250,.96);box-shadow:0 10px 30px -26px rgba(4,32,47,.7)}
.hdr__in{transition:height .25s var(--ease)}
.hdr.is-stuck .hdr__in{height:64px}
.logo svg{transition:width .25s var(--ease)}
.hdr.is-stuck .logo svg{width:104px}

/* A prism reading of scroll depth: the spectrum fills as you descend. */
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;pointer-events:none}
.prog::after{
  content:"";display:block;height:100%;width:100%;
  transform:scaleX(var(--p,0));transform-origin:0 50%;
  background:linear-gradient(90deg,var(--navy) 0%,var(--teal) 34%,var(--aqua) 68%,var(--gold) 100%);
}

.nav__btn{position:relative;transition:color .18s ease,background .18s ease}
.nav__btn::after{
  content:"";position:absolute;left:.78em;right:.78em;bottom:.18em;height:1.5px;
  background:var(--teal);transform:scaleX(0);transform-origin:0 50%;
  transition:transform .22s var(--ease);
}
.nav__btn.is-active{color:var(--teal)}
.nav__btn.is-active::after{transform:scaleX(1)}
.mnav details.is-active > summary{color:var(--teal)}
.mega{transition:opacity .2s ease}
.mega__link{position:relative}
.mega__link::before{
  content:"";position:absolute;left:0;top:.85rem;bottom:.85rem;width:2px;
  background:var(--teal);transform:scaleY(0);transform-origin:50% 0;transition:transform .2s var(--ease);
}
.mega__link:hover::before{transform:scaleY(1)}

/* ============================================================
   HERO — ambient depth behind the prism
   ============================================================ */
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(60% 90% at 78% 34%,rgba(31,156,184,.28),transparent 62%),
    radial-gradient(46% 70% at 12% 96%,rgba(8,58,86,.55),transparent 70%);
}
.hero__in{position:relative;z-index:1}
.hero__h1{
  max-width:none;font-weight:200;line-height:1.03;letter-spacing:-.035em;
  font-size:clamp(2.3rem,5.4vw,4.5rem);
}
.hero__h1 br{display:block}
@media (max-width:520px){.hero__h1{font-size:clamp(2.05rem,10vw,2.9rem)}}
.hero__body{max-width:52ch}
.hero__fig{position:relative}
.hero__fig::before{
  content:"";position:absolute;inset:-8% -6%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(111,214,231,.14),transparent 76%);
}
.hero__fig .prism{position:relative}
.hero__support i{background:linear-gradient(90deg,var(--aqua),transparent)}

/* Interior heroes get the same treatment at lower intensity. */
.phero{overflow:hidden}
.phero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(52% 120% at 88% 18%,rgba(31,156,184,.22),transparent 64%);
}
.phero__in{position:relative;z-index:1}
.phero .ey{margin-bottom:.9rem}

/* ============================================================
   CARDS — one hover behaviour across every card variant
   ============================================================ */
.card{box-shadow:var(--sh-sm)}
.card--link:hover,.card--link:focus-visible{box-shadow:var(--sh-md)}
.card--edge::before{transition:opacity .2s ease}
.pillar{box-shadow:var(--sh-sm)}
.pillars .pillar{padding-top:calc(clamp(20px,2.3vw,32px) + 4px)}
.pillar__go{margin-top:.35rem;transition:gap .2s var(--ease)}
.route{box-shadow:var(--sh-sm)}
.route:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.route{transition:border-color .18s,background .18s,transform .18s var(--ease),box-shadow .18s ease}
.spot__card{border-radius:var(--r-lg);box-shadow:var(--sh-lg)}
.spot__card::after{
  content:"";position:absolute;inset:auto 0 0 0;height:3px;
  background:linear-gradient(90deg,var(--aqua),var(--teal-bright),transparent);
}
.spot__card--trade::after{background:linear-gradient(90deg,var(--gold),var(--aqua),transparent)}
.spot__card .btnrow{margin-top:.4rem}

/* ============================================================
   AUDIENCE LEDGER — "who we work with" / "who is it for"
   ============================================================ */
.auds{list-style:none;margin:2.4rem 0 0;padding:0;border-top:1px solid var(--line)}
.aud{border-bottom:1px solid var(--line-soft)}
.aud__in{
  display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 1.6rem;
  gap:clamp(12px,2.4vw,36px);align-items:baseline;
  padding:1.15rem .6rem 1.15rem 0;text-decoration:none;color:inherit;
  transition:background .18s ease,padding-left .22s var(--ease);
}
a.aud__in:hover{background:linear-gradient(90deg,rgba(31,156,184,.07),transparent 70%);padding-left:.8rem}
.aud strong{font-family:var(--display);font-weight:400;font-size:clamp(1.05rem,1.5vw,1.3rem);color:var(--navy)}
a.aud__in:hover strong{color:var(--teal)}
.aud__d{color:var(--muted);font-size:.95rem}
.aud__go{color:var(--teal);opacity:0;transform:translateX(-4px);transition:.22s var(--ease);justify-self:end}
a.aud__in:hover .aud__go,a.aud__in:focus-visible .aud__go{opacity:1;transform:none}
.auds--flat .aud__in{grid-template-columns:minmax(0,15rem) minmax(0,1fr);padding-right:0;cursor:default}
.sec--ink .aud strong{color:#fff}
.sec--ink .aud__d{color:rgba(233,242,246,.76)}
.sec--ink .auds{border-color:rgba(201,237,244,.2)}
.sec--ink .aud{border-color:rgba(201,237,244,.1)}
@media (max-width:760px){
  .aud__in,.auds--flat .aud__in{grid-template-columns:1fr;gap:.3rem;padding-right:0}
  .aud__go{display:none}
}

/* ============================================================
   BENEFIT LEDGER — numbered outcome statements
   ============================================================ */
.bens{list-style:none;margin:2.2rem 0 0;padding:0;display:grid;gap:0;
  grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(20px,3vw,48px)}
@media (max-width:760px){.bens{grid-template-columns:1fr}}
.ben{
  display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.6rem;align-items:baseline;
  padding:.95rem 0;border-top:1px solid var(--line-soft);color:var(--ink);font-size:1rem;
}
.ben__n{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--teal)}
.sec--ink .ben{border-color:rgba(201,237,244,.14);color:rgba(233,242,246,.86)}
.sec--ink .ben__n{color:var(--aqua)}

/* ============================================================
   WHY / LET'S TALK / CONTACT CARD
   ============================================================ */
.why{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);

.why__lead{display:block;font-family:var(--display);font-weight:300;color:#fff;

.why .lede--light{margin-bottom:1.3rem}

.sec--talk{position:relative}
.sec--talk::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,var(--navy),var(--teal) 34%,var(--aqua) 68%,var(--gold))}
.talk{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.85fr);

.ccard{
  background:rgba(255,255,255,.045);border:1px solid rgba(201,237,244,.16);
  border-radius:var(--r-lg);padding:clamp(22px,2.6vw,34px);position:relative;overflow:hidden;
}
.ccard::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;

.ccard__list{margin:0;display:grid;gap:1.15rem}
.ccard__list > div{display:grid;gap:.28rem}

.ccard__list--light dd{color:var(--muted)}
.ccard__note{font-size:.78rem;color:rgba(201,237,244,.66);margin:1.1rem 0 0;line-height:1.5}

.social{display:flex;gap:.5rem;margin-top:1.5rem}
.social--light{margin-top:1.5rem}
.social__a{
  display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border:1px solid rgba(201,237,244,.24);border-radius:var(--r);color:var(--aqua-pale);
  transition:border-color .18s ease,color .18s ease,background .18s ease,transform .18s var(--ease);
}
.social__a svg{width:17px;height:17px;display:block}

.social--light .social__a{border-color:var(--line);color:var(--navy)}
.social--light .social__a:hover{border-color:var(--teal);color:var(--teal);background:var(--tint)}

/* ============================================================
   SMALL CORRECTIONS
   ============================================================ */
.steps li{transition:background .18s ease}
.steps li:hover{background:rgba(31,156,184,.045)}
.sec--ink .steps li:hover{background:rgba(111,214,231,.06)}
.steps li::before{font-weight:500}
.sec:not(.sec--ink) .steps li::before{color:var(--teal)}

.btn{border-radius:var(--r);will-change:transform}
.btn--pri{box-shadow:0 8px 20px -14px rgba(20,118,140,.9)}

.ftr__cols a{transition:color .16s ease,padding-left .18s var(--ease);display:inline-block}

   Six link columns fit on one row at desktop width; below that they

.sec--talk{padding-block:clamp(52px,6.5vw,96px)}

/* ============================================================
   PRISM FIGURE — 3D
   The container sizes the scene; the labels are placed here and
   read back by prism3d.js, so the beams always land on the text.
   Change a label position in this file and the rays follow.
   ============================================================ */
.p3d{position:relative;width:100%;aspect-ratio:560/430;user-select:none}
.p3d__c{
  position:absolute;inset:0;display:block;width:100%;height:100%;
  touch-action:pan-y;              /* vertical drags stay page scroll */
  cursor:grab;
}
.p3d.is-dragging .p3d__c{cursor:grabbing}
.p3d__labels,.p3d__hint{display:none}
.p3d.is-live .p3d__labels{display:block}
.p3d.is-live .p3d__hint{display:flex}
.p3d.is-live .p3d__fallback{display:none}

.p3d__lbl{
  position:absolute;font-family:var(--mono);font-size:.63rem;font-weight:400;
  letter-spacing:.11em;text-transform:uppercase;white-space:nowrap;line-height:1;
  pointer-events:none;
}
.p3d__lbl--in{left:0;color:rgba(201,237,244,.52)}
.p3d__lbl--out{right:0;text-align:right;color:rgba(233,242,246,.92)}
.p3d .i1{top:22%}
.p3d .i2{top:50%}
.p3d .o1{top:26%}
.p3d .o2{top:40%}
.p3d .o3{top:54%}
.p3d .o4{top:68%}

.p3d__hint{
  position:absolute;right:0;bottom:0;margin:0;display:flex;align-items:center;gap:.45em;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(201,237,244,.42);pointer-events:none;
  transition:opacity .5s var(--ease);
}
.p3d__hint svg{width:15px;height:15px;display:block;opacity:.85}
.p3d.has-dragged .p3d__hint{opacity:0}

/* The static SVG stays the figure until the renderer takes over. */
.p3d__fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.p3d__fallback .prism--wide{width:100%}

@media (max-width:760px){
  .p3d{aspect-ratio:1/1.06}
  .p3d__lbl{font-size:.58rem;letter-spacing:.09em}
  .p3d__lbl--out{right:2%}
  /* Inputs stay top-left and outputs move to the bottom-right, so the
     beam still enters on the left and leaves on the right and no ray
     has to cross back over the solid. */
  .p3d .i1{top:1%}
  .p3d .i2{top:12%}
  .p3d .o1{top:64%}
  .p3d .o2{top:72%}
  .p3d .o3{top:80%}
  .p3d .o4{top:88%}
  .p3d__hint{left:0;right:auto;bottom:0;top:auto}
}

/* Reduced motion never initializes the renderer, so the fallback
   diagram is what people see — and it carries the same labels. */
@media (prefers-reduced-motion:reduce){
  .p3d__labels,.p3d__hint{display:none!important}
  .p3d__fallback{display:flex!important}
}

/* ---------- Header ---------- */
function renderNav(){
  $('#nav').innerHTML = NAV.map(g => g.links
    ? `<button class="nav__btn" type="button" data-navid="${g.id}" data-mega="${g.id}" aria-expanded="false" aria-controls="mega">${g.label}${CARET}</button>`
    : `<a class="nav__btn" data-navid="${g.id}" href="${g.h}">${g.label}</a>`
  ).join('') + `
    <span class="nav__util">
      <button class="nav__lang" type="button" aria-label="Select language">EN</button>
      <a class="btn btn--pri" href="#/contact">Book a discovery session</a>
    </span>`;

  $('#mnav').innerHTML = `<div class="mnav__in">` + NAV.map(g => g.links
    ? `<details data-navid="${g.id}"><summary>${g.label}</summary><div class="mnav__sub">${g.links.map(l=>`<a href="${l.h}">${l.t}</a>`).join('')}</div></details>`
    : `<a class="mnav__flat" href="${g.h}">${g.label}</a>`
  ).join('') + `<div class="mnav__cta">
      <a class="btn btn--pri" href="#/contact">Book a discovery session ${ARROW}</a>
      <a class="btn btn--sec" href="#/products/mora-prism">Request a Prism demo</a>
    </div></div>`;

  // Mega menus
  const mega = $('#mega');
  document.querySelectorAll('[data-mega]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const open = btn.getAttribute('aria-expanded')==='true';
      closeMega();
      if(open) return;
      const g = NAV.find(x=>x.id===btn.dataset.mega);
      mega.innerHTML = `<div class="mega__in">
        <div class="mega__blurb"><span class="ey">${esc(g.label)}</span><p>${esc(g.blurb)}</p></div>
        <div class="mega__links">${g.links.map(l=>
          `<a class="mega__link" href="${l.h}"><strong>${esc(l.t)}</strong><span>${esc(l.d)}</span></a>`).join('')}</div>
      </div>`;
      mega.dataset.open='true';
      btn.setAttribute('aria-expanded','true');
    });
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeMega();closeMobile();} });
  document.addEventListener('click',e=>{
    if(!e.target.closest('.hdr')) closeMega();
    if(e.target.closest('a[href^="#/"]')){ closeMega(); closeMobile(); }
  });
  $('#burger').addEventListener('click',()=>{
    const open = $('#mnav').dataset.open==='true';
    $('#mnav').dataset.open = open?'false':'true';
    $('#burger').setAttribute('aria-expanded', open?'false':'true');
    $('#burger').setAttribute('aria-label', open?'Open menu':'Close menu');
  });
}
function closeMega(){
  $('#mega').dataset.open='false';
  document.querySelectorAll('[data-mega]').forEach(b=>b.setAttribute('aria-expanded','false'));
}
function closeMobile(){
  $('#mnav').dataset.open='false';
  $('#burger').setAttribute('aria-expanded','false');
}

/* ==========================================================
   ACTIVE SECTION — the header states where you are.
   Each top-level nav item owns a set of route prefixes.
   ========================================================== */
const NAV_ROUTES = {
  do:['/intelligence','/advance','/international'],
  prod:['/products/'],
  sol:['/solutions/'],
  ind:['/industries'],
  ins:['/insights'],
  co:['/about','/how-we-work','/trust','/partners','/careers','/contact','/legal']
};
function markActiveNav(path){
  let active = null;
  for(const [id, prefixes] of Object.entries(NAV_ROUTES)){
    if(prefixes.some(pre => path === pre || path.startsWith(pre))){ active = id; break; }
  }
  document.querySelectorAll('[data-navid]').forEach(el=>{
    const on = el.dataset.navid === active;
    el.classList.toggle('is-active', on);
    if(el.tagName === 'A') on ? el.setAttribute('aria-current','page') : el.removeAttribute('aria-current');
  });
}

/* ==========================================================
   HEADER STATE — condensed on scroll, with a spectrum read-out
   of scroll position. Both are decorative and reduced-motion safe.
   ========================================================== */
function initHeaderState(){
  const hdr = document.querySelector('.hdr');
  const bar = document.getElementById('prog');
  let ticking = false;
  const update = () => {
    const y = window.scrollY || 0;
    hdr.classList.toggle('is-stuck', y > 12);
    if(bar){
      const max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.setProperty('--p', max > 0 ? (y / max) : 0);
    }
    ticking = false;
  };
  addEventListener('scroll', () => {
    if(!ticking){ ticking = true; requestAnimationFrame(update); }
  }, {passive:true});
  addEventListener('resize', update, {passive:true});
  update();
}

/* ==========================================================
   SIGNATURE — the prism refraction diagram
   Fragmented internal data and external market signals enter on the
   left; the prism resolves them into an ordered, prioritized spectrum
   of decisions on the right. This is the company's thesis, drawn.
   ========================================================== */
function prismSVG(){
  const rnd = [0.82,0.46,1,0.64,0.9,0.55,0.72,0.38];
  const tickRow = (y0, n, seed) => Array.from({length:n},(_,i)=>{
    const y = y0 + i*13.5, w = 24 + rnd[(i+seed)%8]*66;
    return `<line class="ray-in anim" x1="14" y1="${y}" x2="${14+w}" y2="${y}" style="animation-delay:${.15+i*.045}s,${.15+i*.045}s"/>`;
  }).join('');
  const bands = [
    {y:148, c:'#6FD6E7', l:'Performance gap'},
    {y:200, c:'#31AFCB', l:'Supply risk'},
    {y:252, c:'#D9A441', l:'Product opportunity', gold:true},
    {y:304, c:'#2E86A8', l:'Market pathway'}
  ];
  return `<svg class="prism prism--wide" viewBox="0 0 560 430" role="img"
    aria-label="Diagram: fragmented internal data and external market signals pass through the MORA Prism and emerge as four prioritized decisions — performance gap, supply risk, product opportunity and market pathway.">
    <text class="lbl-in anim" x="14" y="66" style="animation-delay:.05s">Internal data</text>
    ${tickRow(80, 5, 0)}
    <text class="lbl-in anim" x="14" y="196" style="animation-delay:.1s">External signals</text>
    ${tickRow(210, 5, 3)}

    <!-- convergence into the prism face -->
    <line class="ray-in anim" x1="108" y1="107" x2="238" y2="226" style="animation-delay:.5s,.5s"/>
    <line class="ray-in anim" x1="108" y1="237" x2="238" y2="230" style="animation-delay:.5s,.5s"/>

    <path class="body anim" d="M268 114 L212 340 L324 340 Z" style="animation-delay:.55s"/>
    <text class="lbl-in anim" x="268" y="364" text-anchor="middle" style="animation-delay:.6s">Prism</text>

    ${bands.map((b,i)=>`
      <line class="band anim" x1="296" y1="228" x2="398" y2="${b.y}" stroke="${b.c}"
        style="animation-delay:${.75+i*.11}s,${.75+i*.11}s"/>
      <text class="lbl-out anim" x="408" y="${b.y+3.5}" style="animation-delay:${.95+i*.11}s">${b.l}</text>
      ${b.gold?`<circle class="dot anim" cx="400" cy="${b.y}" r="3.2" style="animation-delay:${1.05+i*.11}s"/>`:''}
    `).join('')}
  </svg>`;
}

/* Narrow screens get a vertical arrangement of the same diagram so the
   labels stay legible rather than shrinking with the container. */
function prismCompactSVG(){
  const rnd=[0.82,0.46,1,0.64,0.9,0.55,0.72,0.38];
  const tickRow=(y0,n,seed)=>Array.from({length:n},(_,i)=>{
    const y=y0+i*11, w=18+rnd[(i+seed)%8]*54;
    return `<line class="ray-in anim" x1="10" y1="${y}" x2="${10+w}" y2="${y}" style="animation-delay:${.15+i*.045}s,${.15+i*.045}s"/>`;
  }).join('');
  // Fan the bands to a horizontal line, then read them out as a legend
  // beneath, so nothing crosses a label at this width.
  const bands=[
    {x:45,ly:398,c:'#6FD6E7',l:'Performance gap'},
    {x:115,ly:426,c:'#31AFCB',l:'Supply risk'},
    {x:185,ly:454,c:'#D9A441',l:'Product opportunity',gold:true},
    {x:255,ly:482,c:'#2E86A8',l:'Market pathway'}
  ];
  return `<svg class="prism prism--compact" viewBox="0 0 340 520" aria-hidden="true" focusable="false">
    <text class="lbl-in anim" x="10" y="18" style="animation-delay:.05s">Internal data</text>
    ${tickRow(32,5,0)}
    <text class="lbl-in anim" x="10" y="112" style="animation-delay:.1s">External signals</text>
    ${tickRow(126,5,3)}
    <line class="ray-in anim" x1="80" y1="82" x2="152" y2="212" style="animation-delay:.5s,.5s"/>
    <line class="ray-in anim" x1="80" y1="170" x2="158" y2="214" style="animation-delay:.5s,.5s"/>
    <path class="body anim" d="M170 196 L118 298 L222 298 Z" style="animation-delay:.55s"/>
    <text class="lbl-in anim" x="170" y="276" text-anchor="middle" style="animation-delay:.6s">Prism</text>
    ${bands.map((b,i)=>`
      <line class="band anim" x1="170" y1="300" x2="${b.x}" y2="356" stroke="${b.c}"
        style="animation-delay:${.75+i*.11}s,${.75+i*.11}s"/>
      ${b.gold?`<circle class="dot anim" cx="${b.x}" cy="356" r="3.2" style="animation-delay:${1.05+i*.11}s"/>`:''}
    `).join('')}
    ${bands.map((b,i)=>`
      <line class="band anim" x1="10" y1="${b.ly}" x2="30" y2="${b.ly}" stroke="${b.c}"
        style="animation-delay:${1.05+i*.09}s,${1.05+i*.09}s"/>
      <text class="lbl-out anim" x="40" y="${b.ly+3.5}" style="animation-delay:${1.1+i*.09}s">${b.l}</text>
    `).join('')}
  </svg>`;
}

/* ==========================================================

   A container the 3D renderer takes over. Until it does — no
   JavaScript, no canvas, or prefers-reduced-motion — the static

   on the enhancement.

   The six labels are positioned in CSS and read back by
   prism3d.js, so the beams always terminate exactly where the
   text sits at any breakpoint.
   ========================================================== */
const PRISM_IN  = ['Internal data','External signals'];
const PRISM_OUT = ['Performance gap','Supply risk','Product opportunity','Market pathway'];

function prismFigure(){
  return `<div class="p3d" data-prism3d role="img"

    </div>
    <p class="p3d__hint" aria-hidden="true">

  </div>`;
}

/* ---------- Article template ----------
   Demonstrates every element the spec requires of an insight:
   summary, dates, evidence with source notes, business implications,
   methodology and limitations, author, reviewer and tags. */
function pageArticle(){
  return `<div class="phero"><div class="phero__in">
      <nav class="crumb" aria-label="Breadcrumb"><a href="#/">Home</a><span>/</span><a href="#/insights">Insights</a><span>/</span>Supply Chain and Procurement</nav>
      <span class="ey ey--pale">Supply Chain and Procurement</span>
      <h1 style="max-width:22ch">Spend visibility is not supply-market visibility</h1>
      <p class="lede">Most organizations that describe themselves as having poor supply-market visibility actually have three separate problems. Treating them as one is why the fix keeps failing.</p>
      <p class="crumb" style="margin:1.6rem 0 0">Published 4 August 2026 <span>·</span> Updated 4 August 2026 <span>·</span> 7 min read <span>·</span> MORA Intelligence team</p>
    </div></div>
    ${sec('sec--panel', `<div class="article__grid">
      <article class="prose">
        <p><strong>Summary.</strong> "We have no visibility" is one complaint describing three conditions: spend data that cannot be trusted, category definitions that do not match how supply markets behave, and no monitoring of the external conditions that move price and availability. Each has a different cost and a different owner. Organizations that buy a single tool for all three usually solve the first and leave the other two intact.</p>

        <h2>The three conditions, separated</h2>
        <p>The first condition is internal. Spend sits across entities, systems and vendor records that were never reconciled, so the same supplier appears several times and the same item is classified inconsistently. This is a data problem with a known fix and a measurable end state.</p>
        <p>The second condition is structural. Categories are usually inherited from accounting or from organizational history rather than from how supply markets actually behave. When a category groups items whose prices move for unrelated reasons, category-level analysis cannot produce a usable signal — the movements cancel each other out.<sup>1</sup></p>
        <p>The third condition is external and continuous. Supply markets, commodity indices, logistics capacity and country conditions move whether or not anyone is watching. Without a monitoring model, they are read reactively, after a price change or a missed delivery has already happened.</p>

        <h2>Why the single-tool approach stalls</h2>
        <p>A spend analytics implementation resolves the first condition well. It does not redraw category definitions, because that requires a judgement about supply-market behaviour rather than a data transformation. And it does not monitor external conditions unless external sources are licensed, mapped to the category structure and refreshed on a defined cycle.</p>
        <p>The result is a familiar pattern: a clean spend baseline, delivered on time, that still cannot answer why a category's cost moved.</p>

        <h3>What to sequence instead</h3>
        <ul>
          <li>Establish the spend baseline first, and publish it with a data-quality score rather than as an exact figure.</li>
          <li>Redraw categories around supply-market behaviour for the few categories that carry material value, not for the whole taxonomy at once.</li>
          <li>Attach external monitoring only to those redrawn categories, with a stated refresh frequency and source licence.</li>
          <li>Set the review cadence before the first dashboard is built, so monitoring has an owner from the start.</li>
        </ul>

        <h2>Business implications</h2>
        <p>Sequencing this way makes the cost visible early. Redrawing categories is analytical work with a defined scope; licensing external sources is a recurring cost that should be justified per category rather than bought as a bundle. Organizations that assess both before committing to a platform tend to license fewer sources and use them harder.</p>
        <p>It also changes who owns the outcome. A spend baseline can be owned by a data team. Category redefinition cannot — it requires category managers to accept a structure they did not inherit, which is a change-management task rather than a technical one.</p>

        <h2>Methodology and limitations</h2>
        <p>This analysis draws on structured interviews conducted by MORA during diagnostic engagements and on published supply-chain research. The interview base is small and self-selecting: organizations that commission a sourcing diagnostic are, by definition, ones that already suspect a visibility problem. The pattern described here should be read as a working hypothesis for how to sequence work, not as a measured distribution across the wider market.</p>
        <p>No customer data was used in preparing this article. Figures cited from external sources are attributed with source and retrieval date, and no estimate has been presented as an observation.</p>
      </article>

      <aside class="aside">
        <div><h3>Sources</h3><ol>
          <li>${ph('Source name')} — ${ph('Publication')}, ${ph('Date')}. Retrieved ${ph('Date')}.</li>
          <li>${ph('Source name')} — ${ph('Publication')}, ${ph('Date')}. Retrieved ${ph('Date')}.</li>
        </ol></div>
        <div><h3>Evidence status</h3><p>Working hypothesis based on qualitative interviews. Not a measured market distribution. No customer data used.</p></div>
        <div><h3>Author</h3><p>MORA Intelligence team</p></div>
        <div><h3>Reviewed by</h3><p>${ph('Reviewer name and role')}</p></div>
        <div><h3>Topics</h3><p>Procurement · Spend analytics · Supply-market intelligence · Category management</p></div>
        <div><h3>Related</h3><p><a href="#/solutions/procurement" style="color:var(--teal)">Solutions for procurement teams ${ARROW}</a></p></div>
      </aside>
    </div>`)}
    ${cta('Test this against your own categories.',
      'A sourcing diagnostic establishes the spend baseline, identifies which categories justify redefinition and states what external monitoring would cost.',
      ['Request a sourcing diagnostic','#/contact'],['Back to insights','#/insights'])}`;
}

/* ---------- assets/js/prism3d.js ---------- */
/* ============================================================
   MORA Industries — the prism, in three dimensions.

   A self-contained renderer: no library, no build step, no
   third-party request. Roughly 300 lines of geometry, a painter's
   algorithm and a pointer handler.

   The scene is a triangular prism extruded along z. Two bundles of
   fragmented input strike the face turned furthest to the left,
   travel through the solid, and leave the face turned furthest to
   the right as four separated, prioritized outputs. Because the
   entry and exit faces are chosen from the *rotated* normals, the
   beam keeps reading correctly at every angle.

   The four output labels never move. Only the prism and the beams
   do — so the diagram stays legible while it spins.

   Under prefers-reduced-motion this never initializes and the
   static SVG diagram remains in place.
   ============================================================ */
(function(){
'use strict';

/* ---------- Geometry: apex-up triangle, extruded along z ---------- */
var AX = 0,   AY =  0.80,
    BX = -0.80, BY = -0.56,
    CX = 0.80,  CY = -0.56,
    DZ = 0.60;

var VERTS = [
  [AX, AY,  DZ], [BX, BY,  DZ], [CX, CY,  DZ],   /* front cap  0,1,2 */
  [AX, AY, -DZ], [BX, BY, -DZ], [CX, CY, -DZ]    /* back cap   3,4,5 */
];
/* Wound so every normal points outward. */
var CAPS  = [[0,1,2],[5,4,3]];
var SIDES = [[0,3,4,1],[1,4,5,2],[2,5,3,0]];     /* A-B, B-C, C-A */
var EDGES = [[0,1],[1,2],[2,0],[3,4],[4,5],[5,3],[0,3],[1,4],[2,5]];

var CAM = 4.15;                 /* camera distance on +z            */
var AUTO = 0.0038;              /* idle rotation, radians per frame  */
var REST_PITCH = 0.28;          /* the angle it settles back to      */
var MAX_PITCH = 0.62;

/* Spectrum, in the order the four outputs are labelled. Gold stays
   reserved for opportunity, per the brand rules. */
var RAYS = ['201,237,244','111,214,231','184,134,43','31,156,184'];

var instance = null;

/* ---------- Small vector helpers ---------- */
function sub(a,b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function cross(a,b){
  return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
}
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function norm(a){
  var m = Math.hypot(a[0],a[1],a[2]) || 1;
  return [a[0]/m, a[1]/m, a[2]/m];
}
function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }

/* ============================================================
   Prism
   ============================================================ */
function Prism(root){
  this.root   = root;
  this.canvas = root.querySelector('.p3d__c');
  this.ctx    = this.canvas.getContext('2d');
  this.hint   = root.querySelector('.p3d__hint');

  this.yaw = -0.55; this.pitch = REST_PITCH;
  this.vy = AUTO;   this.vp = 0;
  this.dragging = false; this.pid = null;
  this.visible = true; this.raf = 0;
  this.anchors = {in:[], out:[]};

  this.onResize  = this.measure.bind(this);
  this.onDown    = this.pointerDown.bind(this);
  this.onMove    = this.pointerMove.bind(this);
  this.onUp      = this.pointerUp.bind(this);
  this.onVis     = this.visibility.bind(this);
  this.frame     = this.tick.bind(this);

  this.canvas.addEventListener('pointerdown', this.onDown);
  addEventListener('pointermove', this.onMove, {passive:true});
  addEventListener('pointerup', this.onUp);
  addEventListener('pointercancel', this.onUp);
  document.addEventListener('visibilitychange', this.onVis);

  if(window.ResizeObserver){
    this.ro = new ResizeObserver(this.onResize);
    this.ro.observe(root);
  } else {
    addEventListener('resize', this.onResize);
  }
  if(window.IntersectionObserver){
    var self = this;
    this.io = new IntersectionObserver(function(en){
      self.visible = en[0].isIntersecting;
      self.visible ? self.start() : self.stop();
    }, {rootMargin:'120px'});
    this.io.observe(root);
  }

  this.measure();
  this.start();
}

/* ---------- Sizing, and reading the anchors off the labels ----------
   The labels are placed in CSS, so the rays are drawn to wherever the
   text actually sits. One source of truth, and it survives any
   responsive change to the label positions. */
Prism.prototype.measure = function(){
  var box = this.root.getBoundingClientRect();
  if(!box.width) return;
  var dpr = Math.min(devicePixelRatio || 1, 2);
  this.W = box.width; this.H = box.height;
  this.canvas.width  = Math.round(this.W * dpr);
  this.canvas.height = Math.round(this.H * dpr);
  this.canvas.style.width  = this.W + 'px';
  this.canvas.style.height = this.H + 'px';
  this.ctx.setTransform(dpr,0,0,dpr,0,0);

  /* Portrait means the stacked layout: inputs above, outputs below,
     so the solid sits higher and a little left of centre. */
  var tall = this.H > this.W;
  this.f  = tall ? Math.min(this.W * 0.85, this.H * 0.80)
                 : Math.min(this.W * 0.76, this.H * 0.94);
  this.ox = this.W * (tall ? 0.50 : 0.48);
  this.oy = this.H * (tall ? 0.36 : 0.50);

  var root = this.root;
  var read = function(sel, side){
    var out = [];
    root.querySelectorAll(sel).forEach(function(el){
      var r = el.getBoundingClientRect();
      out.push([
        side === 'in' ? (r.right - box.left + 11) : (r.left - box.left - 11),
        r.top - box.top + r.height / 2,
        r.left - box.left,
        r.bottom - box.top
      ]);
    });
    return out;
  };
  this.anchors.in  = read('.p3d__lbl--in', 'in');
  this.anchors.out = read('.p3d__lbl--out', 'out');
  if(!this.raf) this.render();
};

/* ---------- Loop ---------- */
Prism.prototype.start = function(){
  if(this.raf || !this.visible || document.hidden) return;
  this.raf = requestAnimationFrame(this.frame);
};
Prism.prototype.stop = function(){
  if(this.raf){ cancelAnimationFrame(this.raf); this.raf = 0; }
};
Prism.prototype.visibility = function(){
  document.hidden ? this.stop() : this.start();
};
Prism.prototype.tick = function(){
  if(!this.dragging){
    this.vy += (AUTO - this.vy) * 0.035;      /* momentum decays into the idle drift */
    this.yaw += this.vy;
    this.vp *= 0.90;
    this.pitch = clamp(this.pitch + this.vp, -MAX_PITCH, MAX_PITCH);
    this.pitch += (REST_PITCH - this.pitch) * 0.016;
  }
  this.render();
  this.raf = requestAnimationFrame(this.frame);
};

/* ---------- Pointer ----------
   touch-action:pan-y on the canvas leaves vertical scrolling to the
   browser, so a horizontal drag rotates and a vertical one scrolls
   the page. Nothing here is essential: it is ornament, and the
   diagram reads the same without it. */
Prism.prototype.pointerDown = function(e){
  if(this.pid !== null) return;
  this.pid = e.pointerId;
  this.dragging = true;
  this.lx = e.clientX; this.ly = e.clientY;
  this.vy = 0; this.vp = 0;
  try{ this.canvas.setPointerCapture(e.pointerId); }catch(err){}
  this.root.classList.add('is-dragging','has-dragged');
  this.start();
};
Prism.prototype.pointerMove = function(e){
  if(!this.dragging || e.pointerId !== this.pid) return;
  var dx = e.clientX - this.lx, dy = e.clientY - this.ly;
  this.lx = e.clientX; this.ly = e.clientY;
  this.vy = dx * 0.0072;
  this.vp = -dy * 0.0055;
  this.yaw += this.vy;
  this.pitch = clamp(this.pitch + this.vp, -MAX_PITCH, MAX_PITCH);
};
Prism.prototype.pointerUp = function(e){
  if(e.pointerId !== this.pid) return;
  this.dragging = false; this.pid = null;
  this.root.classList.remove('is-dragging');
};

/* ---------- Render ---------- */
Prism.prototype.render = function(){
  var ctx = this.ctx, W = this.W, H = this.H;
  if(!W) return;
  ctx.clearRect(0,0,W,H);

  var cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
  var cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);

  /* Model -> world: yaw about y, then pitch about x. */
  var R = VERTS.map(function(p){
    var x =  p[0]*cy + p[2]*sy;
    var z = -p[0]*sy + p[2]*cy;
    return [x, p[1]*cp - z*sp, p[1]*sp + z*cp];
  });
  var self = this;
  var project = function(p){
    var k = self.f / (CAM - p[2]);
    return [self.ox + p[0]*k, self.oy - p[1]*k];
  };
  var P = R.map(project);

  /* Faces, with outward normal and centroid depth. */
  var polys = [];
  CAPS.concat(SIDES).forEach(function(idx, i){
    var c = [0,0,0];
    idx.forEach(function(v){ c[0]+=R[v][0]; c[1]+=R[v][1]; c[2]+=R[v][2]; });
    c = [c[0]/idx.length, c[1]/idx.length, c[2]/idx.length];
    var n = norm(cross(sub(R[idx[1]],R[idx[0]]), sub(R[idx[2]],R[idx[0]])));
    var view = norm([-c[0], -c[1], CAM - c[2]]);
    polys.push({idx:idx, z:c[2], n:n, nv:Math.abs(dot(n,view)), front:dot(n,view) > 0, cap:i < 2});
  });
  polys.sort(function(a,b){ return a.z - b.z; });

  /* Entry and exit: the side faces turned furthest left and right. */
  var entry = null, exit = null;
  SIDES.forEach(function(idx){
    var c = [0,0,0];
    idx.forEach(function(v){ c[0]+=R[v][0]; c[1]+=R[v][1]; c[2]+=R[v][2]; });
    c = [c[0]/4, c[1]/4, c[2]/4];
    var n = norm(cross(sub(R[idx[1]],R[idx[0]]), sub(R[idx[2]],R[idx[0]])));
    if(!entry || n[0] < entry.nx) entry = {nx:n[0], p:project(c)};
    if(!exit  || n[0] > exit.nx)  exit  = {nx:n[0], p:project(c)};
  });
  var eIn = entry.p, eOut = exit.p, mid = project([0,0,0]);

  /* 1 — fragmented input, behind the solid */
  ctx.lineCap = 'round';
  this.anchors.in.forEach(function(a){
    ctx.strokeStyle = 'rgba(201,237,244,.34)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(eIn[0], eIn[1]); ctx.stroke();
    ctx.strokeStyle = 'rgba(201,237,244,.30)';
    [46,32,40].forEach(function(w,i){
      var y = a[3] + 7 + i*5;
      ctx.beginPath(); ctx.moveTo(a[2], y); ctx.lineTo(a[2]+w, y); ctx.stroke();
    });
  });

  /* 2 — back faces */
  var self2 = this;
  polys.forEach(function(f){ if(!f.front) self2.face(P, f); });

  /* 3 — the refracted path through the solid */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(eIn[0], eIn[1]);
  ctx.quadraticCurveTo(mid[0], mid[1], eOut[0], eOut[1]);
  ctx.strokeStyle = 'rgba(111,214,231,.20)';
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(201,237,244,.72)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  /* 4 — front faces, so the back reads through the glass */
  polys.forEach(function(f){ if(f.front) self2.face(P, f); });

  /* 5 — edges, brighter as they come toward the camera */
  EDGES.forEach(function(e){
    var z = (R[e[0]][2] + R[e[1]][2]) / 2;
    var t = clamp((z + 1.3) / 2.6, 0, 1);
    ctx.strokeStyle = 'rgba(111,214,231,' + (0.30 + t*0.66).toFixed(3) + ')';
    ctx.lineWidth = 0.95 + t*0.85;
    ctx.beginPath();
    ctx.moveTo(P[e[0]][0], P[e[0]][1]);
    ctx.lineTo(P[e[1]][0], P[e[1]][1]);
    ctx.stroke();
  });

  /* 6 — dispersion */
  var g = ctx.createRadialGradient(eOut[0], eOut[1], 0, eOut[0], eOut[1], 34);
  g.addColorStop(0, 'rgba(111,214,231,.20)');
  g.addColorStop(1, 'rgba(111,214,231,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(eOut[0], eOut[1], 34, 0, Math.PI*2); ctx.fill();

  var outs = this.anchors.out;
  ctx.save();
  outs.forEach(function(a, i){
    var dx = a[0]-eOut[0], dy = a[1]-eOut[1];
    var m = Math.hypot(dx,dy) || 1;
    var px = -dy/m, py = dx/m;                       /* separate the rays at the face */
    var o = (i - (outs.length-1)/2) * 3.4;
    var col = RAYS[i % RAYS.length];
    ctx.strokeStyle = 'rgba(' + col + ',.92)';
    ctx.lineWidth = 1.6;
    ctx.shadowColor = 'rgba(' + col + ',.55)';
    ctx.shadowBlur = 9;
    ctx.beginPath();
    ctx.moveTo(eOut[0] + px*o, eOut[1] + py*o);
    ctx.lineTo(a[0] - 9, a[1]);
    ctx.lineTo(a[0], a[1]);
    ctx.stroke();
  });
  ctx.restore();

  ctx.fillStyle = 'rgba(233,242,246,.9)';
  ctx.beginPath(); ctx.arc(eOut[0], eOut[1], 2, 0, Math.PI*2); ctx.fill();
};

/* One translucent face. Alpha rises as the face turns edge-on, which
   is roughly how glass behaves and reads as solidity without fog. */
Prism.prototype.face = function(P, f){
  var ctx = this.ctx, idx = f.idx;
  ctx.beginPath();
  ctx.moveTo(P[idx[0]][0], P[idx[0]][1]);
  for(var i=1;i<idx.length;i++) ctx.lineTo(P[idx[i]][0], P[idx[i]][1]);
  ctx.closePath();

  var edge = 1 - f.nv;
  var a = (f.cap ? 0.042 : 0.058) + edge*0.165;
  if(!f.front) a *= 0.5;

  var ys = idx.map(function(v){ return P[v][1]; });
  var g = ctx.createLinearGradient(0, Math.min.apply(null,ys), 0, Math.max.apply(null,ys));
  g.addColorStop(0, 'rgba(111,214,231,' + (a*1.5).toFixed(3) + ')');
  g.addColorStop(0.55, 'rgba(31,156,184,' + (a*0.9).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(8,58,86,'   + (a*0.7).toFixed(3) + ')');
  ctx.fillStyle = g;
  ctx.fill();
};

Prism.prototype.destroy = function(){
  this.stop();
  this.canvas.removeEventListener('pointerdown', this.onDown);
  removeEventListener('pointermove', this.onMove);
  removeEventListener('pointerup', this.onUp);
  removeEventListener('pointercancel', this.onUp);
  document.removeEventListener('visibilitychange', this.onVis);
  if(this.ro) this.ro.disconnect(); else removeEventListener('resize', this.onResize);
  if(this.io) this.io.disconnect();
};

/* ============================================================
   Mount. Called after every route render; a no-op on pages
   without a prism, and on the reduced-motion path.
   ============================================================ */
function initPrism3D(){
  if(instance){ instance.destroy(); instance = null; }
  var root = document.querySelector('[data-prism3d]');
  if(!root) return;
  var canvas = root.querySelector('.p3d__c');
  if(!canvas || !canvas.getContext || !canvas.getContext('2d')) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  root.classList.add('is-live');          /* hides the static SVG fallback */
  instance = new Prism(root);
}

window.initPrism3D = initPrism3D;
})();


/* ---------- assets/js/router.js ---------- */
/* MORA Industries — router, interaction wiring and init */

/* ==========================================================
   ROUTER
   ========================================================== */
const ROUTES = {
  '/':pageHome, '/intelligence':pageIntelligence, '/products/mora-prism':pagePrism,
  '/advance':pageAdvance, '/international':pageInternational, '/products/masdar-trade':pageMasdar,
  '/industries':pageIndustriesIndex, '/insights':pageInsights, '/insights/supply-market-visibility':pageArticle,
  '/about':pageAbout, '/how-we-work':pageHowWeWork, '/trust':pageTrust,
  '/partners':pagePartners, '/careers':pageCareers, '/contact':pageContact, '/legal':pageLegal
};
const TITLES = {
  '/':'MORA Industries │ Intelligence, Advancement and International Growth',
  '/intelligence':'MORA Intelligence | Business & Market Intelligence',
  '/products/mora-prism':'MORA Prism | Business & Market Intelligence Workspace',
  '/advance':'MORA Advance | Product Advancement & Process Excellence',
  '/international':'MORA International | Global Sourcing & Export Development',
  '/products/masdar-trade':'Masdar Trade | B2B Manufacturer & Sourcing Marketplace',
  '/industries':'Industries | MORA Industries',
  '/insights':'Insights | MORA Industries',
  '/insights/supply-market-visibility':'Spend visibility is not supply-market visibility | MORA Industries',
  '/about':'About MORA Industries | Research, Advancement and Global Growth',
  '/how-we-work':'How We Work | MORA Industries',
  '/trust':'Trust and Governance | MORA Industries',
  '/partners':'Partners | MORA Industries',
  '/careers':'Careers | MORA Industries',
  '/contact':'Contact MORA Industries',
  '/legal':'Legal | MORA Industries'
};

/* Meta descriptions per route, taken from the approved content.
   The prototype rewrites them on navigation; server-rendered pages
   should emit them statically. */
const METAS = {
  '/':'MORA Industries helps businesses understand markets, improve products and processes, and build new opportunities for international growth.',
  '/intelligence':'Connect internal business, supply-chain and operational information with external market intelligence to support clearer decisions.',
  '/products/mora-prism':'Bring approved internal data, curated market intelligence and opportunity management into one decision workspace.',
  '/advance':'Develop commercially relevant products and create efficient, controlled and technology-enabled processes with MORA Advance.',
  '/international':'Support global sourcing, foreign procurement, export development and selected international market pathways through structured research and qualification.',
  '/products/masdar-trade':'Connect manufacturers, business buyers, distributors and procurement teams through structured profiles, product discovery and B2B inquiry workflows.',
  '/industries':'Sector context, evidence-backed trends and the decisions they change across the industries MORA covers.',
  '/insights':'Market intelligence, product advancement and international growth analysis from the MORA Industries team.',
  '/about':'Purpose, vision and the operating model behind MORA Intelligence, MORA Advance and MORA International.',
  '/how-we-work':'A controlled path from business question to measurable outcome, with defined scopes and evidence standards.',
  '/trust':'Data control, source traceability, verification scope and human accountability across MORA engagements and products.',
  '/partners':'The specialist ecosystem behind MORA delivery across legal, logistics, certification and technical disciplines.',
  '/careers':'Open roles at MORA Industries and how we hire.',
  '/contact':'Tell us what you are trying to understand, improve, develop or expand.',
  '/legal':'Privacy, cookies, website terms, marketplace terms and the other documents approved before launch.'
};

function resolve(path){
  if(ROUTES[path]) return [ROUTES[path], TITLES[path]];
  let m = path.match(/^\/solutions\/([\w-]+)$/);
  if(m && SOLUTIONS[m[1]]) return [()=>pageSolution(m[1]), `${SOLUTIONS[m[1]].name} | MORA Industries`];
  m = path.match(/^\/industries\/([\w-]+)$/);
  if(m && INDUSTRIES[m[1]]) return [()=>pageIndustry(m[1]), `${INDUSTRIES[m[1]].name} | MORA Industries`];
  return [page404,'Page not found | MORA Industries'];
}

function setMeta(path, title){
  document.title = title;
  const d = document.querySelector('meta[name="description"]');
  const desc = METAS[path] || METAS['/'];
  if(d) d.setAttribute('content', desc);
  const og = document.querySelector('meta[property="og:title"]');
  if(og) og.setAttribute('content', title);
  const ogd = document.querySelector('meta[property="og:description"]');
  if(ogd) ogd.setAttribute('content', desc);
  const canon = document.querySelector('link[rel="canonical"]');
  if(canon) canon.setAttribute('href', 'https://[domain]' + (ROUTE_MAP['#'+path] || path));
}

function router(){
  const path = (location.hash.replace(/^#/,'') || '/').replace(/\/$/,'') || '/';
  const [fn, title] = resolve(path);
  setMeta(path, title);
  const main = $('#main');
  main.innerHTML = fn();
  closeMega(); closeMobile();
  window.scrollTo({top:0, behavior:'auto'});
  if(booted){ main.setAttribute('tabindex','-1'); main.focus({preventScroll:true}); }
  booted = true;
  wire();
  markActiveNav(path);
  observeReveal();
  initPrism3D();
}

let booted = false;

/* ---------- Per-page interaction wiring ---------- */
function wire(){
  // Insight category filter
  const grid = $('#postgrid');
  if(grid){
    document.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click',()=>{
        const f = chip.dataset.filter;
        document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', String(c===chip)));
        let shown = 0;
        grid.querySelectorAll('.post').forEach(p=>{
          const match = (f==='all' || p.dataset.cat===f);
          p.hidden = !match; if(match) shown++;
        });
        $('#postempty').hidden = shown > 0;
        $('#postcount').textContent = f==='all'
          ? `Showing all ${shown} insights`
          : `Showing ${shown} insight${shown===1?'':'s'} in ${f}`;
      });
    });
  }

  // Forms — prototype only, no data is transmitted
  document.querySelectorAll('form[data-form]').forEach(form=>{
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const invalid = form.querySelector(':invalid');
      if(invalid){
        form.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));
        invalid.setAttribute('aria-invalid','true');
        invalid.focus();
        return;
      }
      if(form.dataset.form==='contact'){
        const ok = $('#formok');
        ok.hidden = false;
        ok.innerHTML = `<div class="okmsg"><strong>Thank you. Your request has been received.</strong>
          <p>A MORA team member will review the information and contact you through the selected method. Please do not submit confidential technical, commercial or personal information through this form.</p></div>`;
        form.hidden = true;
        ok.setAttribute('tabindex','-1'); ok.focus();
      } else {
        const btn = form.querySelector('button[type="submit"]');
        btn.textContent = 'Subscription request recorded';
        btn.disabled = true;
      }
    });
  });
}

/* ---------- Scroll reveal ---------- */
let io;
function observeReveal(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{rootMargin:'0px 0px -8% 0px'});
  const els = document.querySelectorAll('#main .sec > .wrap > *');
  els.forEach(el=>{ el.classList.add('rv'); io.observe(el); });
  // Safety net: never leave content hidden if the observer does not fire.
  setTimeout(()=>els.forEach(el=>el.classList.add('in')), 2500);
}

/* ---------- Init ---------- */
renderNav();
renderFooter();
initHeaderState();
window.addEventListener('hashchange', router);
router();

</script>
